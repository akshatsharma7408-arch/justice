# JUSTICE Legal AI - local stack: FastAPI backend + Qdrant + Neo4j
# Usage:
#   cp .env.example .env   # fill in GEMINI_API_KEY (never commit .env)
#   docker compose up --build
#   docker compose exec backend python -m app.ingest.seed_qdrant
#   docker compose exec backend python -m app.ingest.seed_neo4j
# Backend: http://localhost:8000  (docs at /docs, health at /health)

services:
  backend:
    build:
      context: ./backend
    container_name: justice-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-justice_secret}
    depends_on:
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.10.0
    container_name: justice-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  neo4j:
    image: neo4j:5.23-community
    container_name: justice-neo4j
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-justice_secret}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  qdrant_storage:
  neo4j_data:
